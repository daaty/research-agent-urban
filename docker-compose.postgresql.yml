version: '3.8'

services:
  # 🗄️ NOVA VERSÃO COM POSTGRESQL
  research-agent-postgresql:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: research-agent-urban-postgresql
    restart: unless-stopped
    
    # Volumes para persistência
    volumes:
      - agent_data_pg:/app/data
      - agent_browser_pg:/app/browser-data
      - agent_cache_pg:/app/cache
      
    environment:
      # Configurações básicas
      - NODE_ENV=production
      - TZ=America/Sao_Paulo
      
      # URLs e configurações do sistema
      - RIDES_LOGIN_URL=${RIDES_LOGIN_URL:-https://carreira.ridesapp.com.br/driver/login}
      - RIDES_USERNAME=${RIDES_USERNAME}
      - RIDES_PASSWORD=${RIDES_PASSWORD}
      - N8N_WEBHOOK_URL=${N8N_WEBHOOK_URL}
      
      # 🗄️ CONFIGURAÇÕES POSTGRESQL (VPS)
      - ENABLE_DATABASE=${ENABLE_DATABASE:-true}
      - ENABLE_WEBHOOK=${ENABLE_WEBHOOK:-true}
      - DATABASE_URL=${DATABASE_URL:-postgresql://postgres:senha123@host.docker.internal:5432/rides_db}
      - DB_HOST=${DB_HOST:-host.docker.internal}
      - DB_PORT=${DB_PORT:-5432}
      - DB_NAME=${DB_NAME:-rides_db}
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_SSL=${DB_SSL:-false}
      
      # Configurações do navegador e VNC
      - DISPLAY=:99
      - VNC_PASSWORD=${VNC_PASSWORD:-youvncpassword}
      - BROWSER_HEADLESS=${BROWSER_HEADLESS:-false}
      - BROWSER_TIMEOUT=${BROWSER_TIMEOUT:-30000}
      
      # Configurações de scraping
      - SCRAPE_INTERVAL=${SCRAPE_INTERVAL:-2.5}
      - MAX_RETRIES=${MAX_RETRIES:-3}
      - CACHE_ENABLED=${CACHE_ENABLED:-true}
      
      # 🚀 NOVAS PORTAS (PARA CONVIVER COM VERSÃO ANTERIOR)
      - PORT=${PORT:-3040}
      - VNC_PORT=${VNC_PORT:-6090}
      - NOVNC_PORT=${NOVNC_PORT:-6091}
      
    ports:
      - "${PORT:-3040}:3040"      # API Web (nova porta)
      - "${NOVNC_PORT:-6091}:6091"  # noVNC (nova porta)
      - "${VNC_PORT:-6090}:5902"    # VNC direto (nova porta)
      
    # Health check (nova porta)
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3040/api/status"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
      
    # Recursos
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: "1.0"
        reservations:
          memory: 512M
          cpus: "0.25"
          
    # Políticas de segurança
    security_opt:
      - no-new-privileges:true
      
    # Configurações de rede
    networks:
      - research_agent_postgresql_network
    
    # Conectar ao PostgreSQL externo (host da VPS)
    extra_hosts:
      - "host.docker.internal:host-gateway"

# Volumes nomeados para persistência (separados da versão anterior)
volumes:
  agent_data_pg:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /opt/research-agent-urban-postgresql/data
      
  agent_browser_pg:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /opt/research-agent-urban-postgresql/browser-data
      
  agent_cache_pg:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /opt/research-agent-urban-postgresql/cache

# Rede isolada (separada da versão anterior)
networks:
  research_agent_postgresql_network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.21.0.0/16
