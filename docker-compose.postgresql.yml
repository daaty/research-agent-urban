version: '3.8'

services:
  # 🤖 AI AGENT VERSION WITH POSTGRESQL
  research-agent-ai:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: research-agent-urban-ai
    restart: unless-stopped
    
    # Volumes para persistência
    volumes:
      - agent_data_ai:/app/data
      - agent_browser_ai:/app/browser-data
      - agent_cache_ai:/app/cache
      - agent_screenshots_ai:/app/screenshots
      - agent_logs_ai:/app/ai-logs
      
    environment:
      # Configurações básicas
      - NODE_ENV=production
      - TZ=America/Sao_Paulo
      
      # URLs e configurações do sistema
      - RIDES_LOGIN_URL=${RIDES_LOGIN_URL:-https://carreira.ridesapp.com.br/driver/login}
      - RIDES_USERNAME=${RIDES_USERNAME}
      - RIDES_PASSWORD=${RIDES_PASSWORD}
      - N8N_WEBHOOK_URL=${N8N_WEBHOOK_URL}
      
      # 🤖 CONFIGURAÇÕES AI AGENT
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - AI_ENABLED=${AI_ENABLED:-true}
      - AI_MAX_RETRIES=${AI_MAX_RETRIES:-3}
      - AI_SCREENSHOT_ON_ERROR=${AI_SCREENSHOT_ON_ERROR:-true}
      - AI_WAIT_TIMEOUT=${AI_WAIT_TIMEOUT:-30000}
      - AI_CONTEXT_MEMORY=${AI_CONTEXT_MEMORY:-true}
      
      # 🗄️ CONFIGURAÇÕES POSTGRESQL
      - ENABLE_DATABASE=${ENABLE_DATABASE:-true}
      - ENABLE_WEBHOOK=${ENABLE_WEBHOOK:-true}
      - DATABASE_URL=${DATABASE_URL:-postgresql://rides_user:rides_password@n8n_postgres:5432/rides_db}
      - DB_HOST=${DB_HOST:-n8n_postgres}
      - DB_PORT=${DB_PORT:-5432}
      - DB_NAME=${DB_NAME:-rides_db}
      - DB_USER=${DB_USER:-rides_user}
      - DB_PASSWORD=${DB_PASSWORD:-rides_password}
      - DB_SSL=${DB_SSL:-false}
      
      # Configurações do navegador e VNC
      - DISPLAY=:99
      - VNC_PASSWORD=${VNC_PASSWORD:-youvncpassword}
      - BROWSER_HEADLESS=${BROWSER_HEADLESS:-false}
      - BROWSER_TIMEOUT=${BROWSER_TIMEOUT:-30000}
      
      # Configurações de scraping
      - SCRAPE_INTERVAL=${SCRAPE_INTERVAL:-2.5}
      - MAX_RETRIES=${MAX_RETRIES:-3}
      - CACHE_ENABLED=${CACHE_ENABLED:-true}
      
      # 🚀 NOVAS PORTAS (PARA CONVIVER COM VERSÃO ANTERIOR)
      - PORT=${PORT:-3040}
      - VNC_PORT=${VNC_PORT:-6090}
      - NOVNC_PORT=${NOVNC_PORT:-6091}
      
    ports:
      - "${PORT:-3040}:3040"      # API Web (nova porta)
      - "${NOVNC_PORT:-6091}:6091"  # noVNC (nova porta)
      - "${VNC_PORT:-6090}:5902"    # VNC direto (nova porta)
      
    # Health check (nova porta)
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3040/api/status"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
      
    # Recursos
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: "1.0"
        reservations:
          memory: 512M
          cpus: "0.25"
          
    # Políticas de segurança
    security_opt:
      - no-new-privileges:true
      
    # Configurações de rede (conectar ao PostgreSQL existente)
    networks:
      - research_agent_ai_network
      - n8n_postgres_network  # Rede do PostgreSQL/ChatWoot existente

# Volumes nomeados para persistência AI AGENT
volumes:
  agent_data_ai:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /opt/research-agent-urban-ai/data
      
  agent_browser_ai:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /opt/research-agent-urban-ai/browser-data
      
  agent_cache_ai:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /opt/research-agent-urban-ai/cache

  agent_screenshots_ai:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /opt/research-agent-urban-ai/screenshots

  agent_logs_ai:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /opt/research-agent-urban-ai/ai-logs

# Redes
networks:
  research_agent_ai_network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.22.0.0/16
  n8n_postgres_network:
    external: true  # Rede externa do PostgreSQL/ChatWoot
