version: '3.8'

services:
  research-agent-urban:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: research-agent-urban-v3
    restart: unless-stopped
    
    # Volumes para persistência
    volumes:
      - agent_data:/app/data
      - agent_browser:/app/browser-data
      - agent_cache:/app/cache
      
    environment:
      # Configurações básicas
      - NODE_ENV=production
      - TZ=America/Sao_Paulo
      
      # URLs e configurações do sistema (NOVA VERSÃO)
      - RIDES_LOGIN_URL=${RIDES_LOGIN_URL:-https://rides.ec2dashboard.com/#/page/login}
      - RIDES_USERNAME=${RIDES_USERNAME}
      - RIDES_PASSWORD=${RIDES_PASSWORD}
      - N8N_WEBHOOK_URL=${N8N_WEBHOOK_URL}
      
      # PostgreSQL externo
      - DATABASE_URL=${DATABASE_URL:-postgres://n8n_user:n8n_pw@148.230.73.27:5432/n8n_db?sslmode=disable}
      
      # Configurações do navegador e VNC
      - DISPLAY=:99
      - VNC_PASSWORD=${VNC_PASSWORD:-youvncpassword}
      - HEADLESS_MODE=${HEADLESS_MODE:-false}
      - BROWSER_TIMEOUT=${BROWSER_TIMEOUT:-30000}
      
      # Configurações de scraping (NOVA VERSÃO COM MOTORISTAS)
      - SCRAPE_INTERVAL=${SCRAPE_INTERVAL:-5}
      - MAX_RETRIES=${MAX_RETRIES:-3}
      - CACHE_ENABLED=${CACHE_ENABLED:-true}
      
    ports:
      - "3040:3040"               # Web UI (Nova porta)
      - "6091:6091"               # noVNC (acesso web ao VNC)
      - "5902:5902"               # VNC direto
      
    # Health check (Nova versão com motoristas + database)
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3040/api/status"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
      
    # Recursos
    deploy:
      resources:
        limits:
          memory: 1.5G
          cpus: "0.8"
        reservations:
          memory: 512M
          cpus: "0.25"
          
    # Políticas de segurança
    security_opt:
      - no-new-privileges:true
      
    # Configurações de rede
    networks:
      - research_agent_network

# Volumes nomeados para persistência
volumes:
  agent_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /opt/research-agent-urban/data
      
  agent_browser:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /opt/research-agent-urban/browser-data
      
  agent_cache:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /opt/research-agent-urban/cache

# Rede isolada
networks:
  research_agent_network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
