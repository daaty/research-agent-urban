[supervisord]
nodaemon=true
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid

[program:xvfb]
command=/usr/bin/Xvfb :99 -screen 0 1280x1024x24
autorestart=true
stdout_logfile=/var/log/supervisor/xvfb.log
stderr_logfile=/var/log/supervisor/xvfb.log

[program:x11vnc]
command=/usr/bin/x11vnc -display :99 -nopw -listen localhost -xkb -ncache 10 -ncache_cr -forever -rfbport 5901
depends_on=xvfb
autorestart=true
stdout_logfile=/var/log/supervisor/x11vnc.log
stderr_logfile=/var/log/supervisor/x11vnc.log

[program:novnc]
command=/opt/novnc/utils/websockify/run --web /opt/novnc 6080 localhost:5901
depends_on=x11vnc
autorestart=true
stdout_logfile=/var/log/supervisor/novnc.log
stderr_logfile=/var/log/supervisor/novnc.log

[program:research-agent]
command=/usr/local/bin/node /app/dist/app-persistent.js
directory=/app
environment=DISPLAY=":99",NODE_ENV="production"
depends_on=xvfb
autorestart=true
stdout_logfile=/var/log/supervisor/research-agent.log
stderr_logfile=/var/log/supervisor/research-agent.log
user=root
