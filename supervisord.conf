[supervisord]
nodaemon=true
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid

[program:xvfb]
command=/usr/bin/Xvfb :99 -screen 0 1600x1200x24 -ac +extension GLX +render -noreset -dpi 96
autorestart=true
stdout_logfile=/var/log/supervisor/xvfb.log
stderr_logfile=/var/log/supervisor/xvfb.log

[program:x11vnc]
command=bash -c "sleep 2 && /usr/bin/x11vnc -display :99 -nopw -listen 0.0.0.0 -xkb -ncache 10 -ncache_cr -forever -rfbport 5902 -shared -desktop VNC-Research-Agent -geometry 1600x1200 -scale 1600x1200 -cursor arrow -cursorpos -pointer_mode 1 -buttonmap 123 -noxdamage"
depends_on=xvfb
autorestart=true
stdout_logfile=/var/log/supervisor/x11vnc.log
stderr_logfile=/var/log/supervisor/x11vnc.log

[program:novnc]
command=bash -c "sleep 4 && /opt/novnc/utils/websockify/run --web /opt/novnc 6091 localhost:5902"
depends_on=x11vnc
autorestart=true
stdout_logfile=/var/log/supervisor/novnc.log
stderr_logfile=/var/log/supervisor/novnc.log

[program:research-agent]
command=npm run dev
directory=/app
environment=DISPLAY=":99",NODE_ENV="development"
depends_on=xvfb
autorestart=false
startsecs=10
startretries=1
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
user=root
# Versão: Research Agent Urban v3.0.0 com Scraping de Rides + Drivers integrado
