version: '3.8'

services:
  # 🤖 AI AGENT VERSION - CODESPACE EDITION
  research-agent-ai:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: research-agent-urban-ai
    restart: unless-stopped
    
    # Portas expostas
    ports:
      - "3040:3040"    # API
      - "6090:6090"    # VNC Port
      - "6091:6091"    # noVNC Web Interface
    
    # Volumes para persistência
    volumes:
      - ./data:/app/data
      - ./browser-data:/app/browser-data
      - ./cache:/app/cache
      - ./screenshots:/app/screenshots
      - ./ai-logs:/app/ai-logs
      
    environment:
      # Configurações básicas
      - NODE_ENV=production
      - TZ=America/Sao_Paulo
      
      # URLs e configurações do sistema
      - RIDES_LOGIN_URL=${RIDES_LOGIN_URL:-https://carreira.ridesapp.com.br/driver/login}
      - RIDES_USERNAME=${RIDES_USERNAME}
      - RIDES_PASSWORD=${RIDES_PASSWORD}
      - N8N_WEBHOOK_URL=${N8N_WEBHOOK_URL}
      
      # 🤖 CONFIGURAÇÕES AI AGENT
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - AI_ENABLED=${AI_ENABLED:-true}
      - AI_MAX_RETRIES=${AI_MAX_RETRIES:-3}
      - AI_SCREENSHOT_ON_ERROR=${AI_SCREENSHOT_ON_ERROR:-true}
      - AI_WAIT_TIMEOUT=${AI_WAIT_TIMEOUT:-30000}
      - AI_CONTEXT_MEMORY=${AI_CONTEXT_MEMORY:-true}
      
      # 🗄️ CONFIGURAÇÕES POSTGRESQL (Simulada para testes)
      - ENABLE_DATABASE=${ENABLE_DATABASE:-false}
      - ENABLE_WEBHOOK=${ENABLE_WEBHOOK:-true}
      - DATABASE_URL=${DATABASE_URL:-}
      - DB_HOST=${DB_HOST:-}
      - DB_PORT=${DB_PORT:-}
      - DB_NAME=${DB_NAME:-}
      - DB_USER=${DB_USER:-}
      - DB_PASSWORD=${DB_PASSWORD:-}
      - DB_SSL=${DB_SSL:-false}
      
      # Configurações do navegador e VNC
      - BROWSER_HEADLESS=${BROWSER_HEADLESS:-false}
      - BROWSER_TIMEOUT=${BROWSER_TIMEOUT:-30000}
      - VNC_PASSWORD=${VNC_PASSWORD:-suasenhaVNC123}
      - DISPLAY=${DISPLAY:-:99}
      
      # Configurações do servidor
      - PORT=${PORT:-3040}
      - VNC_PORT=${VNC_PORT:-6090}
      - NOVNC_PORT=${NOVNC_PORT:-6091}
      
      # Configurações de scraping
      - ENABLE_AUTO_SCRAPING=${ENABLE_AUTO_SCRAPING:-false}
      - SCRAPE_INTERVAL=${SCRAPE_INTERVAL:-2.5}
      - MAX_RETRIES=${MAX_RETRIES:-3}
      - CACHE_ENABLED=${CACHE_ENABLED:-true}
      
    networks:
      - research_agent_ai_network
    
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3040/api/status"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

# Redes
networks:
  research_agent_ai_network:
    driver: bridge
